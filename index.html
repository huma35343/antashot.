<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AntaShot - Professional Arcade Game</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        body {
            background: #020617;
            color: #fff;
            font-family: 'Arial Rounded MT Bold', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }
        .game-wrapper {
            position: relative;
            width: 100%;
            max-width: 400px;
            height: 100%;
            max-height: 720px;
            background: linear-gradient(180deg, #1e1b4b 0%, #020617 100%);
            border: 6px solid #f59e0b;
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.9), inset 0 0 20px rgba(245, 158, 11, 0.4);
        }
        .game-header {
            display: flex;
            justify-content: space-around;
            align-items: center;
            background: rgba(15, 23, 42, 0.95);
            padding: 10px;
            border-bottom: 3px solid #f59e0b;
        }
        .stat-box {
            text-align: center;
            color: #fbbf24;
            font-size: 10px;
            font-weight: bold;
            text-transform: uppercase;
        }
        .stat-val {
            color: #fff;
            font-size: 16px;
            font-weight: 900;
            display: block;
            text-shadow: 0 0 5px #f59e0b;
        }
        canvas {
            display: block;
            width: 100%;
            flex: 1;
            background: radial-gradient(circle at center, #312e81 0%, #020617 100%);
        }
        /* Stylish Overlay Screens */
        .overlay-screen {
            position: absolute;
            inset: 0;
            background: rgba(2, 6, 23, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
            z-index: 100;
        }
        .overlay-title {
            font-size: 30px;
            color: #f59e0b;
            text-shadow: 0 0 12px rgba(245, 158, 11, 0.7);
            margin-bottom: 12px;
            font-weight: 900;
        }
        .overlay-desc {
            font-size: 14px;
            color: #cbd5e1;
            margin-bottom: 25px;
            line-height: 1.6;
        }
        .btn-play {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: #fff;
            border: 3px solid #fff;
            padding: 15px 35px;
            font-size: 18px;
            font-weight: 900;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(245, 158, 11, 0.7);
            text-shadow: 1px 1px 2px #000;
        }
        .btn-play:active {
            transform: scale(0.95);
        }
        .game-footer {
            background: rgba(15, 23, 42, 0.95);
            border-top: 3px solid #f59e0b;
            text-align: center;
            padding: 10px;
            font-size: 12px;
            color: #fbbf24;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="game-wrapper">
        <div class="game-header">
            <div class="stat-item">LEVEL<span id="lvl" class="stat-val">1</span></div>
            <div class="stat-item">TARGETS<span id="tgt" class="stat-val">0</span></div>
            <div class="stat-item">SHOTS<span id="sht" class="stat-val">0</span></div>
            <div class="stat-item">SCORE<span id="scr" class="stat-val">0</span></div>
        </div>

        <canvas id="gameCanvas"></canvas>

        <!-- Menu / Level Start Overlay Screen -->
        <div id="gameOverlay" class="overlay-screen">
            <h1 id="overlayTitle" class="overlay-title">🔮 AntaShot Arcade</h1>
            <p id="overlayDesc" class="overlay-desc">Gulel se kancha khinch kar rang-birange 3D antion ko fodein aur naya record banayein!</p>
            <button id="overlayBtn" class="btn-play">Khelna Shuru Karein</button>
        </div>

        <div class="game-footer">
            🎯 Gulel se nishana sadhein aur kancha fodein!
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const overlay = document.getElementById('gameOverlay');
        const overlayTitle = document.getElementById('overlayTitle');
        const overlayDesc = document.getElementById('overlayDesc');
        const overlayBtn = document.getElementById('overlayBtn');

        let level = 1;
        let score = 0;
        let shots = 10;
        let targets = [];
        let particles = [];
        let gameState = 'START'; // START, PLAYING, LEVEL_TRANSITION, GAMEOVER

        let slingX = 200, slingY = 520;
        let ball = { x: 200, y: 520, r: 18, vx: 0, vy: 0, moving: false };

        let isDragging = false;
        let dragX = 200, dragY = 520;

        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSound(type) {
            if (!audioCtx) return;
            try {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                if (type === 'stretch') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                    osc.frequency.linearRampToValueAtTime(320, audioCtx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.1);
                } else if (type === 'shoot') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.7, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.15);
                } else if (type === 'hit') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(900, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.22);
                    gain.gain.setValueAtTime(0.9, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.22);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.22);
                } else if (type === 'win') {
                    let notes = [350, 450, 600, 800];
                    notes.forEach((f, i) => {
                        let o = audioCtx.createOscillator();
                        let g = audioCtx.createGain();
                        o.type = 'triangle';
                        o.frequency.setValueAtTime(f, audioCtx.currentTime + i * 0.08);
                        g.gain.setValueAtTime(0.6, audioCtx.currentTime + i * 0.08);
                        g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + i * 0.08 + 0.18);
                        o.connect(g); g.connect(audioCtx.destination);
                        o.start(audioCtx.currentTime + i * 0.08);
                        o.stop(audioCtx.currentTime + i * 0.08 + 0.18);
                    });
                }
            } catch(e) {}
        }

        function resize() {
            canvas.width = canvas.clientWidth || 360;
            canvas.height = canvas.clientHeight || 500;
            slingX = canvas.width / 2;
            slingY = canvas.height - 70;
            resetBall();
        }
        window.addEventListener('resize', resize);
        resize();

        function resetBall() {
            ball.x = slingX;
            ball.y = slingY;
            ball.vx = 0;
            ball.vy = 0;
            ball.moving = false;
            dragX = slingX;
            dragY = slingY;
        }

        function initLevel() {
            targets = [];
            particles = [];
            let count = 4 + level * 2;
            shots = count + 4;

            for (let i = 0; i < count; i++) {
                let col = i % 4;
                let row = Math.floor(i / 4);
                targets.push({
                    x: (canvas.width / 5) * (col + 1),
                    y: 70 + (row * 45),
                    r: 19,
                    color: `hsl(${i * 50 + level * 40}, 95%, 55%)`,
                    alive: true
                });
            }
            resetBall();
            updateUI();
        }

        function updateUI() {
            document.getElementById('lvl').innerText = level;
            document.getElementById('tgt').innerText = targets.filter(t => t.alive).length;
            document.getElementById('sht').innerText = shots;
            document.getElementById('scr').innerText = score;
        }

        function triggerLevelStartScreen() {
            gameState = 'LEVEL_TRANSITION';
            playSound('win');
            overlayTitle.innerText = `Level ${level} Start! 🎉`;
            overlayDesc.innerText = `Shaandar! Agla level shuru hone ke liye taiyar ho jayein.`;
            overlayBtn.innerText = "Level Shuru Karein";
            overlay.style.display = 'flex';
        }

        function triggerGameOverScreen(reason) {
            gameState = 'GAMEOVER';
            overlayTitle.innerText = "Game Over! ❌";
            overlayDesc.innerText = `${reason}\nFinal Score: ${score}`;
            overlayBtn.innerText = "Dobara Khele";
            overlay.style.display = 'flex';
        }

        function handleOverlayAction(e) {
            if(e) e.stopPropagation();
            initAudio();
            overlay.style.display = 'none';

            if (gameState === 'START' || gameState === 'GAMEOVER') {
                if (gameState === 'GAMEOVER') {
                    level = 1;
                    score = 0;
                }
                gameState = 'PLAYING';
                initLevel();
            } else if (gameState === 'LEVEL_TRANSITION') {
                gameState = 'PLAYING';
                initLevel();
            }
        }

        overlayBtn.addEventListener('click', handleOverlayAction);
        overlayBtn.addEventListener('touchstart', handleOverlayAction);
        overlay.addEventListener('click', handleOverlayAction);
        overlay.addEventListener('touchstart', handleOverlayAction);

        function getPos(e) {
            let rect = canvas.getBoundingClientRect();
            let clientX = e.touches ? e.touches[0].clientX : e.clientX;
            let clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: clientX - rect.left, y: clientY - rect.top };
        }

        canvas.addEventListener('mousedown', (e) => onStart(getPos(e)));
        canvas.addEventListener('mousemove', (e) => onMove(getPos(e)));
        window.addEventListener('mouseup', onEnd);

        canvas.addEventListener('touchstart', (e) => { initAudio(); e.preventDefault(); onStart(getPos(e)); }, {passive: false});
        canvas.addEventListener('touchmove', (e) => { e.preventDefault(); onMove(getPos(e)); }, {passive: false});
        window.addEventListener('touchend', onEnd);

        function onStart(pos) {
            initAudio();
            if (gameState !== 'PLAYING' || ball.moving) return;
            let d = Math.hypot(pos.x - slingX, pos.y - slingY);
            if (d < 50) {
                isDragging = true;
                playSound('stretch');
            }
        }

        function onMove(pos) {
            if (!isDragging) return;
            let dx = pos.x - slingX;
            let dy = pos.y - slingY;
            let dist = Math.hypot(dx, dy);
            let maxPull = 90;

            if (dist > maxPull) {
                dx = (dx / dist) * maxPull;
                dy = (dy / dist) * maxPull;
            }
            if (dy < 0) dy = 0; 

            dragX = slingX + dx;
            dragY = slingY + dy;
            ball.x = dragX;
            ball.y = dragY;
        }

        function onEnd() {
            if (!isDragging) return;
            isDragging = false;

            let dx = slingX - dragX;
            let dy = slingY - dragY;
            let power = Math.hypot(dx, dy);

            if (power > 15) {
                ball.vx = dx * 0.2;
                ball.vy = dy * 0.2;
                ball.moving = true;
                shots--;
                playSound('shoot');
                updateUI();
            } else {
                resetBall();
            }
        }

        function createParticles(x, y, color) {
            playSound('hit');
            for (let i = 0; i < 18; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 9,
                    vy: (Math.random() - 0.5) * 9,
                    r: Math.random() * 4 + 2,
                    color: color,
                    alpha: 1
                });
            }
        }

        function loop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (isDragging || ball.moving) {
                ctx.beginPath();
                ctx.moveTo(slingX - 18, slingY);
                ctx.lineTo(ball.x, ball.y);
                ctx.lineTo(slingX + 18, slingY);
                ctx.strokeStyle = '#cbd5e1';
                ctx.lineWidth = 4;
                ctx.stroke();
            }

            // Slingshot Post
            ctx.fillStyle = '#b45309';
            ctx.fillRect(slingX - 6, slingY, 12, 45);
            ctx.beginPath();
            ctx.arc(slingX, slingY, 12, 0, Math.PI * 2);
            ctx.fillStyle = '#78350f';
            ctx.fill();

            if (gameState === 'PLAYING') {
                if (ball.moving) {
                    ball.x += ball.vx;
                    ball.y += ball.vy;
                    ball.vy += 0.15;

                    if (ball.x - ball.r < 0 || ball.x + ball.r > canvas.width) ball.vx *= -1;

                    targets.forEach(t => {
                        if (t.alive) {
                            let dist = Math.hypot(ball.x - t.x, ball.y - t.y);
                            if (dist < ball.r + t.r) {
                                t.alive = false;
                                createParticles(t.x, t.y, t.color);
                                score += 150 * level;
                                updateUI();
                            }
                        }
                    });

                    if (ball.y > canvas.height + 30 || ball.y < -30 || (Math.abs(ball.vx) < 0.2 && ball.y > slingY)) {
                        resetBall();
                        let aliveCount = targets.filter(t => t.alive).length;
                        if (aliveCount === 0) {
                            level++;
                            triggerLevelStartScreen();
                        } else if (shots <= 0) {
                            triggerGameOverScreen("Shots Khatam Ho Gaye! ❌");
                        }
                    }
                }
            }

            // Draw 3D Glass Marbles (Targets)
            targets.forEach(t => {
                if (!t.alive) return;
                ctx.beginPath();
                ctx.arc(t.x, t.y, t.r, 0, Math.PI * 2);
                ctx.fillStyle = t.color;
                ctx.fill();
                ctx.lineWidth = 2.5;
                ctx.strokeStyle = "#fff";
                ctx.stroke();

                // 3D Glass Swirl & Glossy Shine
                ctx.beginPath();
                ctx.arc(t.x - 2, t.y - 2, t.r * 0.5, 0, Math.PI * 1.5);
                ctx.strokeStyle = "rgba(255,255,255,0.4)";
                ctx.lineWidth = 3;
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(t.x - 5, t.y - 5, 5, 0, Math.PI * 2);
                ctx.fillStyle = "rgba(255,255,255,0.85)";
                ctx.fill();
            });

            // Particles
            particles.forEach((p, idx) => {
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 0.04;
                if (p.alpha <= 0) particles.splice(idx, 1);
                else {
                    ctx.save();
                    ctx.globalAlpha = p.alpha;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    ctx.fillStyle = p.color;
                    ctx.fill();
                    ctx.restore();
                }
            });

            // Draw Player Ball (3D Red Marble)
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
            ctx.fillStyle = "#ef4444";
            ctx.fill();
            ctx.lineWidth = 3;
            ctx.strokeStyle = "#fff";
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(ball.x - 2, ball.y - 2, ball.r * 0.5, 0, Math.PI * 1.5);
            ctx.strokeStyle = "rgba(255,255,255,0.5)";
            ctx.lineWidth = 3;
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(ball.x - 5, ball.y - 5, 5, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(255,255,255,0.9)";
            ctx.fill();

            // Aiming Guide Line
            if (isDragging) {
                ctx.beginPath();
                ctx.setLineDash([4, 6]);
                ctx.moveTo(slingX, slingY);
                ctx.lineTo(slingX + (slingX - dragX) * 2, slingY + (slingY - dragY) * 2);
                ctx.strokeStyle = '#22c55e';
                ctx.lineWidth = 3;
                ctx.stroke();
                ctx.setLineDash([]);
            }

            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
